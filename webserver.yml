
---
- name: webserver stu wwith system roles and jinja2
  hosts: webservers
  become: true
  vars:
    timesync_ntp_server:
      - hostname: pool.ntp.org
        iburst: true
  roles:
    - redhat.rhel_system_roles.timesync

  tasks:
    - name: create a jinja2 template
      ansible.builtin.template:
        src: /templates/index.html.j2
        dest: /var/www/html/index.html
        owner: root 
        group: root
        mode: '0644'

    - name: service and firewall
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

