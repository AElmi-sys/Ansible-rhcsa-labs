

---
- name: Create users from a file
  hosts: all
  become: true
  vars_files:
    - users_list.yml

  tasks:
    - name: cretae users with their property
      ansible.builtin.user:
        name: "{{ item.name }}"
        uid: "{{ item.uid }}"
        shell: "{{ item.shell }}"
        comment: "{{ item.comment }}" 
        state: present
      loop: "{{ users }}"
       
