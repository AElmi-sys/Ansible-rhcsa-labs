
---
- name: Creat a user with encrypted password
  hosts: all
  become: true
  vars_files:
    - secrets.yml

  tasks:
    - name: create a user with password encrypted 
      ansible.builtin.user:
        name: abdirizak
        password: "{{db_password | password_hash('sha512') }}"
        shell: /bin/bash
        state: present 

